# Mật khẩu SASL của Kafka, lấy từ AWS Secrets Manager thay vì để chart tự sinh
# ngẫu nhiên mỗi lần render (lý do đầy đủ ở khối chú thích trong values.yaml).
#
# Ở đây CHỈ có credential thật. Phần cluster-id/controller-N-id là định danh, suy
# ra được nên không cất ở secret store -- xem templates/kraft-secret.yaml.
#
# Hai khoá THẬT SỰ được dùng là controller-password và inter-broker-password:
# values.yaml chỉ đặt `listeners.client.protocol: PLAINTEXT`, còn listener
# interbroker và controller giữ mặc định SASL_PLAINTEXT của chart. Đừng tưởng
# client PLAINTEXT nghĩa là SASL không dùng -- `kafka.saslEnabled` xét cả hai
# listener đó.
#
# Ba khoá còn lại (client-passwords, hai *-client-secret) hiện KHÔNG dùng --
# client không qua SASL, và *-client-secret chỉ cần cho OAuthBearer. Vẫn phải có
# mặt vì chart đọc cả năm bằng secretKeyRef; thiếu một khoá là pod đứng ở
# CreateContainerConfigError.
#
# Tên khoá bên trong Secret KHÔNG đặt tuỳ ý được -- chart đọc đúng các tên dưới
# đây. Đó cũng là lý do không dùng lại Secret `vox-env` đang có: khoá ở đó theo
# dạng UPPER_SNAKE, không khớp.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kafka-sasl
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.secretStoreRef }}
  target:
    name: kafka-sasl
    creationPolicy: Owner
  data:
    - secretKey: client-passwords
      remoteRef:
        key: vox/app
        property: KAFKA_CLIENT_PASSWORDS
    - secretKey: inter-broker-password
      remoteRef:
        key: vox/app
        property: KAFKA_INTER_BROKER_PASSWORD
    - secretKey: inter-broker-client-secret
      remoteRef:
        key: vox/app
        property: KAFKA_INTER_BROKER_CLIENT_SECRET
    - secretKey: controller-password
      remoteRef:
        key: vox/app
        property: KAFKA_CONTROLLER_PASSWORD
    - secretKey: controller-client-secret
      remoteRef:
        key: vox/app
        property: KAFKA_CONTROLLER_CLIENT_SECRET
