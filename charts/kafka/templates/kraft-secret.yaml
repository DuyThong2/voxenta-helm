# cluster-id và controller-N-id của KRaft, SUY RA thay vì lưu ở đâu cả.
#
# Vì sao không để chart Bitnami tự sinh: helper của nó dùng `randAlphaNum` khi
# `lookup` trả rỗng, mà ArgoCD render bằng `helm template` nên `lookup` LUÔN rỗng
# -- giá trị đổi mỗi lần render, annotation `checksum/secret` đổi theo, và
# StatefulSet cuốn lại pod. Đo thật 2026-08-18: 11 lần trong 20 giờ, mỗi lần
# Kafka đứt ~70 giây, chỉ vì bump tag ảnh Java.
#
# Vì sao KHÔNG cất vào Secrets Manager: đây không phải bí mật. Chúng là ĐỊNH DANH
# thư mục log, và chỉ được dùng lúc format ổ trống -- sau đó Kafka đọc từ
# /bitnami/kafka/data/meta.properties và bỏ qua secret. Kiểm chứng trên cụm cũ:
# secret ghi cluster-id=GKlphtTaUPNAELeArDoFIS còn meta.properties ghi
# cluster.id=DntN2AhjWs0VgbAtx45cCl -- lệch nhau nhiều ngày mà Kafka vẫn chạy.
# Cất một giá trị dùng-một-lần vào secret store là gây hiểu nhầm cho người đọc
# sau, và bắt phải nạp tay thêm một khoá mỗi lần nâng replica.
#
# Yêu cầu thật chỉ là TẤT ĐỊNH LÚC RENDER. Hàm băm của (tên release + chỉ số)
# cho đúng điều đó mà không cần lưu gì: cùng đầu vào ra cùng đầu ra, vĩnh viễn,
# và replicaCount bao nhiêu cũng tự sinh đủ id.
#
# Định dạng giữ nguyên loại chuỗi Bitnami vẫn dùng (22 ký tự chữ-số) -- đó là
# định dạng đã chứng minh boot được trên cụm thật, nên không mạo hiểm gì.
#
# ⚠️ Giá trị phụ thuộc TÊN RELEASE. Đổi tên release (hiện là `kafka`, do
# argocd/apps/kafka-app.yaml đặt) sẽ sinh cluster-id khác; với ổ đĩa đang có dữ
# liệu thì node mới format sẽ không join được quorum cũ. Đừng đổi tên release khi
# PVC còn dữ liệu cần giữ.
apiVersion: v1
kind: Secret
metadata:
  name: kafka-kraft
type: Opaque
stringData:
  cluster-id: {{ printf "%s-kraft-cluster" .Release.Name | sha256sum | trunc 22 | quote }}
  {{- range $i := until (int .Values.kafka.controller.replicaCount) }}
  controller-{{ $i }}-id: {{ printf "%s-kraft-controller-%d" $.Release.Name $i | sha256sum | trunc 22 | quote }}
  {{- end }}
