apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vox-env
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.secretStoreRef }}
  target:
    name: vox-env
    creationPolicy: Owner
  data:
    # `POSTGRES_PASSWORD` feeds the bitnami postgresql subchart's own bootstrap
    # password (postgresql.auth.existingSecret/secretKeys above point at this
    # same key in this same Secret). `DB_PASSWORD` feeds the app itself —
    # application.yaml:113 reads `${DB_PASSWORD}`, NOT `SPRING_DATASOURCE_PASSWORD`
    # (Spring Boot's auto-binding convention doesn't apply here because the app
    # defines its own `app.datasource`-style property names). Both keys must
    # carry the exact same value since they're the password for the same DB
    # user — mapped twice from the one AWS property on purpose, not a typo.
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: vox/database
        property: POSTGRES_PASSWORD
    - secretKey: DB_PASSWORD
      remoteRef:
        key: vox/database
        property: POSTGRES_PASSWORD
    - secretKey: JWT_SECRET
      remoteRef:
        key: vox/jwt
        property: JWT_SECRET
    - secretKey: JWT_STREAM_SECRET
      remoteRef:
        key: vox/jwt
        property: JWT_STREAM_SECRET
    # vox/app groups the remaining app-level secrets that don't fit database/jwt
    # (application.yaml requires all of these to start — no defaults):
    - secretKey: SMTP_USERNAME
      remoteRef:
        key: vox/app
        property: SMTP_USERNAME
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: vox/app
        property: SMTP_PASSWORD
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: vox/app
        property: GOOGLE_CLIENT_SECRET
    # app.oauth2.google.allowed-audiences (application.yaml:349) -- danh sách client ID CỦA MÌNH
    # được chấp nhận trong claim `aud` của Google ID token, phân tách bằng dấu phẩy:
    #   1. client WEB     -- Flutter dùng chung ID này qua google_sign_in
    #   2. client DESKTOP -- WPF gửi ID riêng của nó
    # Đặt đúng một giá trị là một trong hai client luôn bị từ chối đăng nhập.
    #
    # Property đã nạp vào vox/app (02/09/2026) TRƯỚC khi thêm dòng này -- thêm ngược lại thì
    # ExternalSecret không tìm thấy property và cả `vox-env` hỏng đồng bộ, pod mất TOÀN BỘ env.
    - secretKey: GOOGLE_ALLOWED_AUDIENCES
      remoteRef:
        key: vox/app
        property: GOOGLE_ALLOWED_AUDIENCES
    - secretKey: SYS_ADMIN_EMAIL
      remoteRef:
        key: vox/app
        property: SYS_ADMIN_EMAIL
    - secretKey: SYS_ADMIN_PASSWORD
      remoteRef:
        key: vox/app
        property: SYS_ADMIN_PASSWORD
    - secretKey: SYS_ADMIN_PHONE
      remoteRef:
        key: vox/app
        property: SYS_ADMIN_PHONE
    - secretKey: SYS_ADMIN_FULLNAME
      remoteRef:
        key: vox/app
        property: SYS_ADMIN_FULLNAME
    - secretKey: SYS_ADMIN_DATE_OF_BIRTH
      remoteRef:
        key: vox/app
        property: SYS_ADMIN_DATE_OF_BIRTH
    - secretKey: SYS_ADMIN_ADDRESS
      remoteRef:
        key: vox/app
        property: SYS_ADMIN_ADDRESS
    # vox's own S3 storage credential (exam upload bucket) — a separate IAM
    # user from the CI/CD github-actions-* users, do not reuse those.
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: vox/app
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: vox/app
        property: AWS_SECRET_ACCESS_KEY
    # PayOS payment gateway (subscription billing) -- application.yaml:199-204
    # (payos.client-id/api-key/checksum-key/return-url/cancel-url), all default
    # to empty string if unset (feature silently no-ops), so these are only
    # required once subscription payments actually need to work.
    - secretKey: PAYOS_CLIENT_ID
      remoteRef:
        key: vox/app
        property: PAYOS_CLIENT_ID
    - secretKey: PAYOS_API_KEY
      remoteRef:
        key: vox/app
        property: PAYOS_API_KEY
    - secretKey: PAYOS_CHECKSUM_KEY
      remoteRef:
        key: vox/app
        property: PAYOS_CHECKSUM_KEY
    - secretKey: PAYOS_RETURN_URL
      remoteRef:
        key: vox/app
        property: PAYOS_RETURN_URL
    - secretKey: PAYOS_CANCEL_URL
      remoteRef:
        key: vox/app
        property: PAYOS_CANCEL_URL
    # practice.secret (application.yaml:209) -- shared token that agents'
    # PracticeInternalSecretFilter-equivalent check must match exactly (see
    # charts/agents' externalsecret.yaml, same vox/app key). Was unset before
    # (defaulted to ""), so agents' calls to /internal/practice-sessions/** were
    # rejected with 401 in prod.
    - secretKey: PRACTICE_INTERNAL_SECRET
      remoteRef:
        key: vox/app
        property: PRACTICE_INTERNAL_SECRET
    # Cổng thanh toán SePay (application.yaml:426-441, prefix sepay.pg).
    #
    # SEPAY_ENV cố tình KHÔNG khai ở đây: SePayPaymentProperties mặc định SANDBOX, và
    # thiếu cấu hình mà rơi vào PRODUCTION là kiểu hỏng nguy hiểm nhất -- nó thu tiền
    # thật. Muốn lên production phải khai tường minh trong values.yaml.
    - secretKey: SEPAY_MERCHANT_ID
      remoteRef:
        key: vox/app
        property: SEPAY_MERCHANT_ID
    # Khoá ký HMAC form checkout, đồng thời là password Basic auth khi gọi Open API.
    - secretKey: SEPAY_SECRET_KEY
      remoteRef:
        key: vox/app
        property: SEPAY_SECRET_KEY
    # Header X-Secret-Key trên IPN, đặt riêng ở dashboard SePay. TÁCH khỏi SEPAY_SECRET_KEY
    # có chủ đích: dùng chung một giá trị nghĩa là khoá dùng để KÝ bị gửi qua mạng ở mọi
    # lần SePay gọi IPN.
    - secretKey: SEPAY_IPN_SECRET_KEY
      remoteRef:
        key: vox/app
        property: SEPAY_IPN_SECRET_KEY
    # Gốc URL mà SePay redirect TRÌNH DUYỆT NGƯỜI DÙNG về sau khi thanh toán, thành
    # {giá trị}/payment/success|error|cancel (SePayPaymentProcessService:154-156).
    #
    # Phải là domain công khai, KHÔNG phải localhost -- đây là địa chỉ trình duyệt của
    # thí sinh mở, không phải địa chỉ server gọi. Và KHÔNG có dấu "/" cuối, vì code tự
    # nối "/payment/..." nên thừa dấu sẽ ra "//payment/success".
    - secretKey: SEPAY_RETURN_BASE_URL
      remoteRef:
        key: vox/app
        property: SEPAY_RETURN_BASE_URL
    # app.grpc.streaming-token (GrpcClientConfig.java:23) -- vox's own gRPC
    # client calling INTO vox-streaming's HealthService. Reuses vox-streaming's
    # OWN token (vox/streaming/GRPC_SERVICE_TOKEN, already seeded and already
    # read by charts/vox-streaming's externalsecret) rather than a separate
    # secret -- it's the same shared value on both ends by design, no new
    # Secrets Manager entry needed. Was unset before (defaulted to ""), so this
    # gRPC call carried an empty token in prod.
    - secretKey: GRPC_SERVICE_TOKEN
      remoteRef:
        key: vox/streaming
        property: GRPC_SERVICE_TOKEN
    # Spring Boot Admin -- tài khoản đăng nhập trang giám sát.
    #
    # Hai property đã được nạp sẵn vào vox/app (31/08/2026) TRƯỚC khi thêm hai dòng này: thêm
    # ngược lại thì ExternalSecret không tìm thấy property, cả `vox-env` hỏng đồng bộ, và pod mất
    # TOÀN BỘ env chứ không riêng hai biến này.
    #
    # Chưa có code nào đọc chúng (không file nào trong vox nhắc SBA_ADMIN / spring-boot-admin tại
    # thời điểm thêm) -- đặt trước để khi phần Spring Boot Admin merge vào thì không phải chờ một
    # vòng cấu hình hạ tầng nữa.
    - secretKey: SBA_ADMIN_USERNAME
      remoteRef:
        key: vox/app
        property: SBA_ADMIN_USERNAME
    - secretKey: SBA_ADMIN_PASSWORD
      remoteRef:
        key: vox/app
        property: SBA_ADMIN_PASSWORD

