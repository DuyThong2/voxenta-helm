replicaCount: 2
image:
  repository: 975049890010.dkr.ecr.ap-southeast-1.amazonaws.com/vox-app
  tag: "f492411"
  pullPolicy: IfNotPresent
service:
  port: 8080
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 85
  targetMemoryUtilizationPercentage: 85
resources:
  # Brought back down close to the proven pre-session baseline (600m/2Gi
  # request measured real usage ~813-870Mi/157-230m CPU) -- memory raised a
  # bit further to 3.5Gi for headroom on the newly-wired practice-generation
  # HTTP calls + gRPC call to vox-streaming. Limit kept at cpu ~1.67x request,
  # mem 2x request (same ratio used throughout this chart's history).
  requests:
    cpu: 600m
    memory: 3.5Gi
  limits:
    cpu: "1"
    memory: 7Gi
ingress:
  enabled: true
  host: api.voxenta.net
  certificateArn: "arn:aws:acm:ap-southeast-1:975049890010:certificate/ed1ba235-3c99-432e-a370-5ab0312a4d3a"
  albGroupName: vox-backend
  # Must match agents' 3600 -- all 4 Ingresses share one physical ALB
  # (group.name: vox-backend), and idle_timeout is a load-balancer-level
  # attribute, not per-target-group -- mismatched values across group
  # members block the whole ALB from provisioning (confirmed for real:
  # "conflicting load balancer attributes idle_timeout.timeout_seconds:
  # 3600 | 300"). Longer timeout doesn't hurt vox's normal short requests.
  idleTimeoutSeconds: 3600
  # Xem khối chú thích trong templates/ingress.yaml: vox giữ phiên dựng đề luyện tập
  # trong RAM của từng pod, nên nhiều replica mà không sticky là hỏng thật (404 khoảng
  # 2/3 số lần). 7200s khớp agents -- cũng đủ dài hơn hẳn một phiên luyện tập.
  stickinessSeconds: 7200
config:
  SPRING_PROFILES_ACTIVE: prod
  # CorsProperties/SecurityConfig#validatedAllowedOrigins -- Java source now
  # requires this explicitly (rewritten from a wildcard "*" pattern to a
  # strict allowlist), defaults to localhost:3000/5173 if unset. Was never
  # set here -- confirmed live 2026-08-11: every cross-origin request from
  # the real frontend (voxenta.net) got 403 "Invalid CORS request" on
  # preflight, blocking the entire web app, not just one endpoint. Must
  # match CloudFront's aliases exactly (infrastructureFE), no trailing
  # slash/path, comma-separated.
  CORS_ALLOWED_ORIGINS: "https://voxenta.net,https://www.voxenta.net"
  # DemoEducationDataInitializer (@Order(5), ApplicationRunner) seeds a full
  # demo dataset on first startup when enabled: 1 School (DEMO-SCH-01), users
  # (admin/teacher/student, all with DEMO_DATA_PASSWORD below), a
  # SupportedLanguage row, and 1 QuestionBank + QuestionTopic + Question +
  # QuestionEvaluationGuide -- enough to actually run an exam end-to-end
  # without hand-writing SQL against the JPA schema (fragile, easy to drift
  # from entity/migration changes -- this reuses the app's own tested seeding
  # code instead). Runs every startup but is idempotent by DEMO_SCHOOL_CODE
  # (checks School existence first) -- safe to leave "true" across restarts.
  DEMO_DATA_ENABLED: "true"
  DEMO_DATA_PASSWORD: "Password@123"
  KAFKA_BOOTSTRAP_SERVERS: vox-kafka.vox.svc.cluster.local:9092
  REDIS_HOST: vox-redis-master.vox.svc.cluster.local
  REDIS_PORT: "6379"
  # application.yaml:111 builds jdbc:postgresql://${DB_URL}/${DB_NAME} — DB_URL
  # is host:port ONLY, not a full JDBC URL. Matches postgresql.auth.username/
  # database below (must stay in sync if either changes).
  DB_URL: vox-postgresql.vox.svc.cluster.local:5432
  DB_NAME: vox
  DB_USER: vox
  # Google OAuth client ID is not sensitive (it's a public identifier embedded
  # in redirect URLs) — only GOOGLE_CLIENT_SECRET (externalsecret.yaml) is secret.
  GOOGLE_CLIENT_ID: "378994619054-r330gi2bjasmna0lhgohiof8hg9gio6i.apps.googleusercontent.com"
  # Frontend routes the app links to after email flows — real domain, not a
  # secret. Update if the frontend's actual route paths differ.
  PASSWORD_SETUP_URL: https://voxenta.net/setup-password
  OAUTH2_URL: https://voxenta.net/oauth2/success
  # Exam-upload S3 storage (application.yaml:123-133) — all optional/empty by
  # Spring default, but STORAGE_PROVIDER=s3 is what the real dev .env uses, so
  # treat as required for the upload feature to actually work in production.
  # AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY for this are in externalsecret.yaml
  # (vox/app) — a separate IAM user from CI/CD, not the github-actions-* ones.
  STORAGE_PROVIDER: s3
  AWS_REGION: ap-southeast-1
  AWS_S3_PATH_STYLE: "false"
  # Same bucket already used in dev (vox/.env) -- reused as-is, not created by
  # infrastructureBE/infrastructureFE Terraform.
  AWS_S3_BUCKET: vox-exam-uploads
  AWS_S3_KEY_PREFIX: prod
  AWS_S3_PUBLIC_BASE_URL: https://vox-exam-uploads.s3.ap-southeast-1.amazonaws.com
  # Practice-generation clients (TopicGenerationClient/InterestQuizGenerationClient
  # read app.practice.agents-base-url via APP_PRACTICE_AGENTS_BASE_URL's relaxed
  # binding; QuestionDiversityClient/PracticeQuestionGenerationClient/
  # PracticeAgentAvailabilityClient read PRACTICE_AGENTS_BASE_URL directly -- 2
  # different property-key styles across the 5 classes, both need the same value.
  # Was entirely unset before (defaulted to localhost:8000, unreachable from this
  # pod) -- all 5 practice-generation calls were silently broken in prod.
  APP_PRACTICE_AGENTS_BASE_URL: http://agents.vox-agents.svc.cluster.local:8000
  PRACTICE_AGENTS_BASE_URL: http://agents.vox-agents.svc.cluster.local:8000
  # application.yaml:38 -- gRPC channel to vox-streaming's HealthService/AlertService.
  # Default is 0.0.0.0:9096, which only makes sense running vox directly on a dev
  # machine (0.0.0.0 as a DIAL target resolves back to the caller itself, and 9096
  # is the docker-compose port; in k8s vox-streaming listens on 9091 --
  # charts/vox-streaming's service.grpcPort). Was never set here -- confirmed live
  # 2026-08-11: OTP verify returned 503 for every WPF client because its
  # HealthCheckGrpcService call got "Connection refused: /0.0.0.0:9096".
  VOX_STREAMING_GRPC_TARGET: vox-streaming.vox-streaming.svc.cluster.local:9091
  # application.yaml:309 (app.recording.bucket) -- bucket chứa recording.mp4 do vox-streaming
  # ghép xong. RecordRecordingPartChangedUseCase lưu giá trị này vào exam_recordings.bucket;
  # rỗng thì GetExamRecordingPlaybackUseCase.playbackUrlFor() trả null vì không presign được,
  # và trang xem kết quả hiện "Chưa có tệp để phát" DÙ file có thật trên S3.
  # Xác nhận thật 2026-08-11: 4 bản ghi READY, s3_key đầy đủ, recording.mp4 tồn tại trong
  # S3 -- chỉ mỗi cột bucket rỗng. PHẢI khớp STORAGE_RECORDING_BUCKET của charts/vox-streaming.
  RECORDING_S3_BUCKET: vox-exam-log
  # HttpCookieProvider (app.cookie.secure) -- mặc định false vì máy dev chạy http://localhost.
  # Trên deployment mọi thứ đều HTTPS, để false nghĩa là cookie refresh-token KHÔNG gắn cờ
  # Secure, tức trình duyệt sẵn sàng gửi nó qua HTTP thuần nếu có ai dụ được sang link http://
  # -- lộ phiên đăng nhập. Không phải lỗi chức năng (đang chạy vẫn đăng nhập được), mà là lỗ
  # hổng bảo mật.
  # SameSite giữ Lax: voxenta.net và api.voxenta.net cùng một site (chung registrable domain
  # voxenta.net) nên Lax vẫn cho gửi cookie ở request cross-origin giữa hai subdomain. Đổi sang
  # None sẽ nới rộng hơn mức cần thiết.
  COOKIE_SECURE: "true"
  COOKIE_SAME_SITE: Lax
externalSecret:
  refreshInterval: 1h
  secretStoreRef: aws-secrets-manager
postgresql:
  auth:
    existingSecret: vox-env
    secretKeys:
      adminPasswordKey: POSTGRES_PASSWORD
      userPasswordKey: POSTGRES_PASSWORD
    username: vox
    database: vox
  primary:
    persistence:
      enabled: true
      storageClass: gp3
      size: 20Gi
    # Public NLB so pgAdmin/DBeaver/etc. from outside the cluster can connect
    # directly on 5432 -- deliberately open to the internet (no IP allowlist),
    # protected only by the POSTGRES_PASSWORD in `vox/database` (Secrets
    # Manager). This is a real tradeoff, not an oversight: port 5432 WILL get
    # scanned/probed by internet bots. If that becomes a problem, narrow with
    # a security-group CIDR restriction or switch to `kubectl port-forward`.
    service:
      type: LoadBalancer
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-type: nlb
        service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
        service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
redis:
  architecture: standalone
  auth:
    enabled: false
  replica:
    replicaCount: 0
  master:
    persistence:
      enabled: true
      storageClass: gp3
      size: 5Gi
    extraFlags:
      - --appendonly yes
kafka:
  # bitnami/kafka has zero public tags left on Docker Hub (Broadcom moved
  # versioned images behind the paid "Bitnami Secure Images" tier) -- confirmed
  # for real during deploy: ImagePullBackOff, "not found". bitnamilegacy/kafka
  # has the exact same image/tag (just relocated org, not a different build)
  # -- verified this tag exists there before switching. postgresql/redis
  # subcharts still pull fine from bitnami/ as of this deploy; only override
  # the one that's actually broken, don't preemptively touch those.
  image:
    registry: docker.io
    repository: bitnamilegacy/kafka
  kraft:
    enabled: true
  # Kafka defaults offsets.topic.replication.factor=3 (needs 3 brokers to
  # replicate the internal __consumer_offsets topic to) -- with only 1
  # controller/broker (controller.replicaCount: 1, broker.replicaCount: 0),
  # that requirement can never be satisfied, so the topic silently never gets
  # created and EVERY consumer group permanently fails with "Group Coordinator
  # Not Available" -- confirmed for real: `kafka-topics.sh --describe
  # --topic __consumer_offsets` returned "Topic does not exist". Not a
  # transient startup delay, doesn't self-resolve. Same reasoning applies to
  # transaction.state.log.replication.factor (not currently used by any
  # producer here, but fixing both together avoids hitting this again later).
  overrideConfiguration:
    offsets.topic.replication.factor: 1
    transaction.state.log.replication.factor: 1
  controller:
    replicaCount: 1
    persistence:
      enabled: true
      storageClass: gp3
      size: 30Gi
  broker:
    replicaCount: 0
  listeners:
    client:
      protocol: PLAINTEXT
